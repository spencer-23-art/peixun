<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>培训信息录入系统 - 在线答题</title>
  <link rel="stylesheet" href="/static/css/style.css?v=1.0.7">
  <style>
    /* ===== App 外壳：模拟原生体验 ===== */
    * { -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; padding: 0;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
    }
    body {
      display: flex;
      justify-content: center;
      background: var(--bg-dark, #0f172a);
    }

    /* App 容器：居中，手机全屏，PC端限宽 */
    .app-shell {
      width: 100%;
      max-width: 480px;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* 模拟状态栏 */
    .status-bar {
      height: 24px;
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-main, #f8fafc);
      font-variant-numeric: tabular-nums;
    }
    .status-bar-icons { display: flex; gap: 5px; align-items: center; }
    .status-bar-icons svg { width: 14px; height: 10px; }

    /* Home Indicator */
    .home-indicator {
      height: 5px;
      width: 120px;
      background: rgba(255,255,255,0.25);
      border-radius: 3px;
      margin: 4px auto 6px;
      flex-shrink: 0;
    }

    /* 面板：三个面板都用 flex 填充 app-shell */
    .panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }
    .panel.hidden { display: none !important; }

    /* 去掉旧的 glass-container 样式干扰 */
    .glass-container {
      background: none !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      border: none !important;
      box-shadow: none !important;
      border-radius: 0 !important;
      margin: 0 !important;
      padding: 0 !important;
      max-width: none !important;
    }

    /* ===== 开始页 ===== */
    #start-panel .start-header {
      padding: 12px 20px 4px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #start-panel .start-logo {
      width: 32px; height: 32px;
      border-radius: 8px;
      background: var(--primary-color, #6366f1);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    #start-panel .start-logo svg { width: 18px; height: 18px; }
    #start-panel .start-title { font-size: 17px; font-weight: 500; color: var(--text-main); }
    #start-panel .start-subtitle { font-size: 13px; color: var(--text-muted); }

    .start-content {
      flex: 1;
      overflow-y: auto;
      padding: 8px 20px 12px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      -webkit-overflow-scrolling: touch;
    }
    .start-content h2 {
      font-size: 20px; font-weight: 500; color: var(--text-main);
      margin: 8px 0 2px; text-align: center;
    }
    .start-content .subtitle {
      font-size: 14px; color: var(--text-muted);
      text-align: center; margin: 0 0 4px;
    }
    .start-content .form-group { margin-bottom: 0; }
    .start-content .form-group label {
      font-size: 14px; color: var(--text-muted);
      margin-bottom: 6px; display: block;
    }
    .start-content .form-control {
      width: 100%; box-sizing: border-box;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 13px 14px;
      color: var(--text-main); font-size: 16px;
    }
    .start-content .form-control:focus {
      border-color: var(--primary-color, #6366f1);
      outline: none;
    }
    #exam-company {
      cursor: pointer;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 12px center;
      background-size: 14px;
      padding-right: 36px;
    }
    #exam-company:focus {
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236366f1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    }
    #exam-company-dropdown {
      display: none; position: absolute;
      top: calc(100% + 2px); left: 0; right: 0;
      background: rgba(15, 23, 42, 0.98);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px; max-height: 200px; overflow-y: auto;
      z-index: 9999; backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .exam-info-box {
      background: rgba(99,102,241,0.08);
      border: 1px solid rgba(99,102,241,0.2);
      border-radius: 10px;
      padding: 10px 14px;
      display: flex; gap: 10px; align-items: flex-start;
    }
    .exam-info-box svg { flex-shrink: 0; margin-top: 1px; width: 16px; height: 16px; }
    .exam-info-box p { margin: 0; }
    .exam-info-box .info-title { color: var(--text-main); font-size: 14px; font-weight: 500; margin-bottom: 4px; }
    .exam-info-box .info-text { color: var(--text-muted); font-size: 13px; line-height: 1.5; }

    .start-footer {
      flex-shrink: 0;
      padding: 10px 20px 8px;
    }
    .start-footer .btn-primary {
      width: 100%; box-sizing: border-box;
      padding: 15px; border-radius: 12px;
      font-size: 17px; font-weight: 500;
      border: none; cursor: pointer;
    }
    .alert { font-size: 14px; padding: 10px 12px; border-radius: 8px; }
    .alert-error { background: rgba(239,68,68,0.1); color: var(--danger-color); border: 1px solid rgba(239,68,68,0.2); }

    /* ===== 答题页 ===== */
    /* 顶部信息栏：科目+倒计时 / 题号+进度条 */
    .exam-topbar {
      flex-shrink: 0;
      padding: 6px 20px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .exam-topbar-row1 {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 6px;
    }
    .exam-topbar-title { font-size: 15px; font-weight: 500; color: var(--text-main); }
    .exam-timer {
      display: flex; align-items: center; gap: 5px;
      font-size: 15px; font-weight: 500; color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }
    .exam-timer svg { width: 16px; height: 16px; }
    .exam-topbar-row2 {
      display: flex; align-items: center; gap: 8px;
    }
    .exam-counter { font-size: 14px; font-weight: 500; color: var(--primary-color); flex-shrink: 0; }
    .exam-progress-bar {
      flex: 1; height: 5px;
      background: rgba(255,255,255,0.1);
      border-radius: 3px; overflow: hidden;
    }
    .exam-progress-fill {
      height: 100%;
      background: var(--primary-color, #6366f1);
      border-radius: 3px;
      transition: width 0.3s ease;
    }
    .exam-progress-pct { font-size: 13px; color: var(--text-muted); flex-shrink: 0; min-width: 32px; text-align: right; }

    /* 题目区域 */
    .question-area {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex; flex-direction: column;
      justify-content: center;
      -webkit-overflow-scrolling: touch;
    }
    .question-card { width: 100%; }
    .question-header {
      display: flex; gap: 12px; align-items: flex-start;
      margin-bottom: 22px;
    }
    .question-number {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: var(--primary-color, #6366f1);
      color: white;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 500;
      flex-shrink: 0;
    }
    .question-text {
      font-size: 18px; line-height: 1.6;
      color: var(--text-main); margin: 0;
    }
    /* 对/错大按钮 */
    .option-list {
      display: flex; gap: 14px;
    }
    .option-item {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 8px;
      padding: 22px 0;
      background: rgba(255,255,255,0.03);
      border: 2px solid rgba(255,255,255,0.1);
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.15s ease;
      -webkit-user-select: none; user-select: none;
      min-height: 44px;
    }
    .option-item:active { transform: scale(0.97); }
    .option-item svg { width: 32px; height: 32px; }
    .option-item .option-label { font-size: 20px; font-weight: 500; margin: 0; }
    .option-item.selected-correct {
      background: rgba(16,185,129,0.15);
      border-color: var(--accent-color, #10b981);
    }
    .option-item.selected-correct svg { stroke: var(--accent-color, #10b981); }
    .option-item.selected-correct .option-label { color: var(--accent-color, #10b981); }
    .option-item.selected-wrong {
      background: rgba(239,68,68,0.15);
      border-color: var(--danger-color, #ef4444);
    }
    .option-item.selected-wrong svg { stroke: var(--danger-color, #ef4444); }
    .option-item.selected-wrong .option-label { color: var(--danger-color, #ef4444); }
    .option-item.unselected svg { stroke: var(--text-muted, #94a3b8); }
    .option-item.unselected .option-label { color: var(--text-muted, #94a3b8); }

    /* 题号导航条：横向滑动 */
    .question-nav {
      flex-shrink: 0;
      padding: 6px 20px;
      border-top: 1px solid rgba(255,255,255,0.06);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .question-nav::-webkit-scrollbar { display: none; }
    .question-nav-inner {
      display: flex; gap: 5px;
      padding-bottom: 2px;
    }
    .nav-item {
      min-width: 32px; height: 32px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.03);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; color: var(--text-muted);
      cursor: pointer; flex-shrink: 0;
      transition: all 0.15s ease;
      -webkit-user-select: none; user-select: none;
    }
    .nav-item:active { transform: scale(0.92); }
    .nav-item.current {
      background: var(--primary-color, #6366f1);
      color: white; border-color: var(--primary-color, #6366f1);
      font-weight: 500;
    }
    .nav-item.answered {
      background: var(--accent-color, #10b981);
      color: white; border-color: var(--accent-color, #10b981);
    }

    /* 底部操作栏 */
    .exam-actions {
      flex-shrink: 0;
      padding: 8px 20px 10px;
      display: flex; gap: 8px;
    }
    .btn-exam {
      flex: 1;
      border: none; cursor: pointer;
      border-radius: 10px;
      font-size: 15px; font-weight: 500;
      display: flex; align-items: center; justify-content: center; gap: 5px;
      -webkit-user-select: none; user-select: none;
      min-height: 48px;
      padding: 12px 4px;
    }
    .btn-exam:active { transform: scale(0.97); }
    .btn-exam:disabled { opacity: 0.5; }
    .btn-prev {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-muted);
    }
    .btn-submit {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      color: var(--danger-color);
    }
    .btn-next {
      background: var(--primary-color, #6366f1);
      color: white;
    }
    .btn-exam svg { width: 14px; height: 14px; flex-shrink: 0; }

    /* ===== 结果页 ===== */
    .result-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex; flex-direction: column;
      -webkit-overflow-scrolling: touch;
    }
    .result-icon-wrap {
      width: 76px; height: 76px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 8px auto 14px;
    }
    .result-icon-wrap svg { width: 38px; height: 38px; }
    .result-icon-pass {
      background: rgba(16,185,129,0.15);
      border: 2px solid var(--accent-color, #10b981);
    }
    .result-icon-pass svg { stroke: var(--accent-color, #10b981); }
    .result-icon-fail {
      background: rgba(239,68,68,0.15);
      border: 2px solid var(--danger-color, #ef4444);
    }
    .result-icon-fail svg { stroke: var(--danger-color, #ef4444); }
    .result-score {
      font-size: 36px; font-weight: 500;
      color: var(--text-main);
      text-align: center; margin: 0 0 6px;
    }
    .result-score .score-unit { font-size: 18px; color: var(--text-muted); }
    .result-message {
      font-size: 16px; text-align: center; margin: 0 0 18px;
    }
    .result-details {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .detail-row {
      display: flex; justify-content: space-between;
      padding: 9px 0;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      font-size: 15px;
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-row .detail-label { color: var(--text-muted); }
    .detail-row .detail-value { color: var(--text-main); font-weight: 500; }
    .result-footer {
      flex-shrink: 0;
      padding: 10px 20px 8px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .result-footer .btn {
      width: 100%; box-sizing: border-box;
      padding: 15px; border-radius: 12px;
      font-size: 17px; font-weight: 500;
      border: none; cursor: pointer;
      text-align: center;
    }
    .result-footer .btn-primary {
      background: var(--primary-color, #6366f1);
      color: white;
    }
    .result-footer .btn-secondary {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      color: var(--text-muted);
      font-size: 14px;
    }

    /* ===== 超小屏适配 (≤360px) ===== */
    @media (max-width: 360px) {
      .start-content { padding: 8px 16px 12px; }
      .start-footer { padding: 10px 16px 8px; }
      .exam-topbar { padding: 6px 16px 10px; }
      .question-area { padding: 14px 16px; }
      .question-nav { padding: 6px 16px; }
      .exam-actions { padding: 8px 16px 10px; }
      .result-area { padding: 16px; }
      .result-footer { padding: 10px 16px 8px; }
      .question-text { font-size: 16px; }
      .option-item { padding: 16px 0; }
      .option-item .option-label { font-size: 18px; }
      .btn-prev, .btn-next { padding: 12px 10px; font-size: 14px; }
      .btn-prev span, .btn-next span { display: none; }
    }

    /* ===== 横屏适配 ===== */
    @media (orientation: landscape) and (max-height: 500px) {
      .app-shell { max-width: 600px; }
      .question-area { padding: 10px 20px; }
      .question-text { font-size: 15px; }
      .option-item { padding: 12px 0; }
      .option-item svg { width: 26px; height: 26px; }
      .option-item .option-label { font-size: 17px; }
      .question-header { margin-bottom: 12px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- ===== 开始页面 ===== -->
    <div class="panel" id="start-panel">
      <div class="start-header">
        <div class="start-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        </div>
        <div>
          <div class="start-title">在线考试</div>
          <div class="start-subtitle">安全知识培训系统</div>
        </div>
      </div>

      <div class="start-content">
        <h2>填写考试信息</h2>
        <p class="subtitle">请完善个人信息后开始答题</p>

        <div class="alert alert-error" id="start-error" style="display:none;"></div>

        <form id="start-form" onsubmit="return false;" style="display:flex; flex-direction:column; gap:14px;">
          <div class="form-group">
            <label for="exam-name">姓名</label>
            <input type="text" id="exam-name" class="form-control" placeholder="请输入您的姓名" required>
          </div>

          <div class="form-group">
            <label for="exam-id-last6">身份证号后六位</label>
            <input type="text" id="exam-id-last6" class="form-control" placeholder="请输入身份证号后六位" maxlength="6" required>
          </div>

          <div class="form-group" id="exam-company-group" style="display: none;">
            <label for="exam-company-display">工作单位</label>
            <input type="text" id="exam-company-display" class="form-control" disabled style="background: rgba(255,255,255,0.05); color: #aaa; cursor: not-allowed; opacity: 0.8;">
          </div>

          <div class="form-group" id="exam-company-manual-group" style="display: none;">
            <label for="exam-company-manual">工作单位</label>
            <input type="text" id="exam-company-manual" class="form-control" placeholder="请输入您的工作单位名称">
          </div>

          <div class="form-group" id="exam-type-group" style="display: none;">
            <label for="exam-type">考试科目</label>
            <select id="exam-type" class="form-control" required>
              <option value="">正在加载科目列表...</option>
            </select>
          </div>

          <div class="start-footer" style="padding:0;" id="verify-footer">
            <button type="button" class="btn btn-primary" onclick="verifyIdentity()">验证身份</button>
          </div>

          <div class="exam-info-box" id="exam-info-box" style="display: none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="var(--primary-color, #6366f1)" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
            <div>
              <p class="info-title">考试说明</p>
              <p class="info-text">共25题 · 限时30分钟 · 90分及格</p>
            </div>
          </div>

          <div class="start-footer" style="padding:0; display: none;" id="start-footer">
            <button type="button" class="btn btn-primary" onclick="doStartExam()">开始答题</button>
          </div>
        </form>
      </div>
    </div>

    <!-- ===== 答题页面 ===== -->
    <div class="panel hidden" id="exam-panel">
      <!-- 顶部信息栏 -->
      <div class="exam-topbar">
        <div class="exam-topbar-row1">
          <span class="exam-topbar-title" id="exam-title"></span>
          <div class="exam-timer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span id="timer">30:00</span>
          </div>
        </div>
        <div class="exam-topbar-row2">
          <span class="exam-counter" id="question-counter">1/25</span>
          <div class="exam-progress-bar">
            <div class="exam-progress-fill" id="progress-fill"></div>
          </div>
          <span class="exam-progress-pct" id="progress-pct">4%</span>
        </div>
      </div>

      <!-- 题目区 -->
      <div class="question-area" id="question-container"></div>

      <!-- 题号导航条 -->
      <div class="question-nav">
        <div class="question-nav-inner" id="question-nav"></div>
      </div>

      <!-- 底部操作栏 -->
      <div class="exam-actions">
        <button class="btn-exam btn-prev" id="btn-prev" onclick="prevQuestion()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
          <span>上一题</span>
        </button>
        <button class="btn-exam btn-submit" id="btn-submit" onclick="submitExam()">交卷</button>
        <button class="btn-exam btn-next" id="btn-next" onclick="nextQuestion()">
          <span>下一题</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>
    </div>

    <!-- ===== 结果页面 ===== -->
    <div class="panel hidden" id="result-panel">
      <div class="result-area">
        <div class="result-icon-wrap" id="result-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <div class="result-score" id="result-score">0<span class="score-unit">分</span></div>
        <div class="result-message" id="result-message"></div>

        <div class="result-details">
          <div class="detail-row"><span class="detail-label">姓名</span><span class="detail-value" id="detail-name"></span></div>
          <div class="detail-row"><span class="detail-label">工作单位</span><span class="detail-value" id="detail-company"></span></div>
          <div class="detail-row"><span class="detail-label">考试科目</span><span class="detail-value" id="detail-exam"></span></div>
          <div class="detail-row"><span class="detail-label">答题数</span><span class="detail-value" id="detail-answered"></span></div>
          <div class="detail-row"><span class="detail-label">正确数</span><span class="detail-value" id="detail-correct"></span></div>
          <div class="detail-row"><span class="detail-label">用时</span><span class="detail-value" id="detail-time"></span></div>
        </div>
      </div>
      <div class="result-footer">
        <button class="btn btn-primary" id="restart-exam-button" onclick="restartExamDirectly()">重新答题</button>
        <button class="btn btn-secondary" onclick="restartExamWithNewSubject()">更换科目 / 返回</button>
      </div>
    </div>

    <!-- Home Indicator -->
    <div class="home-indicator"></div>
  </div>

  <script>
    // S8: HTML 转义函数，防止题目文本中的 HTML 标签被当作 HTML 执行（XSS 防护）
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    // 考试状态
    let examData = {
      name: '',
      company: '',
      idLast6: '',
      examType: '',
      questions: [],
      answers: {},
      currentIndex: 0,
      startTime: 0,
      timeLimit: 30 * 60,
      remainingTime: 0,
      timerInterval: null
    };

    let examFileMap = {};

    // 显示/隐藏面板
    function showPanel(panelId) {
      document.querySelectorAll('.panel').forEach(panel => {
        panel.classList.add('hidden');
      });
      document.getElementById(panelId).classList.remove('hidden');
    }

    // 身份验证与开始考试逻辑
    let verifiedCompany = '';
    let verifiedIdLast6 = '';
    let isApprovedUser = false;

    async function verifyIdentity() {
      const name = document.getElementById('exam-name').value.trim();
      const idLast6 = document.getElementById('exam-id-last6').value.trim();

      verifiedCompany = '';
      verifiedIdLast6 = '';
      isApprovedUser = false;

      if (!name || !idLast6 || idLast6.length !== 6) {
        document.getElementById('start-error').textContent = '请输入姓名和身份证号后六位';
        document.getElementById('start-error').style.display = 'block';
        return;
      }

      document.getElementById('start-error').style.display = 'none';

      try {
        const response = await fetch('/api/exam/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, id_last6: idLast6 })
        });
        const result = await response.json();

        if (result.matched) {
          verifiedCompany = result.company || '';
          verifiedIdLast6 = idLast6;
          isApprovedUser = !!result.approved;

          if (isApprovedUser) {
            // 审批通过的用户，手动输入工作单位
            document.getElementById('exam-company-group').style.display = 'none';
            document.getElementById('exam-company-manual-group').style.display = 'block';
          } else {
            // 正常匹配，自动填充工作单位
            document.getElementById('exam-company-display').value = verifiedCompany;
            document.getElementById('exam-company-group').style.display = 'block';
            document.getElementById('exam-company-manual-group').style.display = 'none';
          }

          document.getElementById('exam-type-group').style.display = 'block';
          document.getElementById('exam-info-box').style.display = 'flex';
          document.getElementById('start-footer').style.display = 'block';
          document.getElementById('verify-footer').style.display = 'none';
        } else {
          if (result.error === 'name_mismatch') {
            alert('姓名错误，请检查您输入的姓名是否与已录入信息一致！');
          } else if (result.error === 'id_mismatch') {
            alert('身份证号后六位错误，请检查您输入的身份证号后六位是否正确！');
          } else if (result.error === 'pending_approval') {
            alert('答题申请正在审批中，请联系管理员审批后再进行答题！');
          } else if (result.error === 'not_found') {
            alert('信息未录入，请联系管理员！答题申请已自动提交，审批通过后可重新验证开始答题。');
          } else {
            alert(result.detail || '验证失败，请重试');
          }
        }
      } catch (error) {
        console.error('验证失败:', error);
        alert('验证身份失败，网络故障');
      }
    }

    async function doStartExam() {
      const name = document.getElementById('exam-name').value.trim();
      const examType = document.getElementById('exam-type').value;

      let company = verifiedCompany;
      if (isApprovedUser) {
        company = document.getElementById('exam-company-manual').value.trim();
      }

      if (!name || !company || !examType || !verifiedIdLast6) {
        document.getElementById('start-error').textContent = '请填写完整信息（姓名、工作单位、考试科目）';
        document.getElementById('start-error').style.display = 'block';
        return;
      }

      document.getElementById('start-error').style.display = 'none';

      try {
        const response = await fetch('/api/exam/check_eligibility', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, id_last6: verifiedIdLast6, exam_type: examType })
        });
        const result = await response.json();
        if (!response.ok || result.code !== 200 || !result.allowed) {
          document.getElementById('start-error').textContent = result.detail || '该科目暂不能开始答题';
          document.getElementById('start-error').style.display = 'block';
          return;
        }
      } catch (error) {
        console.error('检查考试资格失败:', error);
        document.getElementById('start-error').textContent = '检查考试资格失败，请检查网络后重试';
        document.getElementById('start-error').style.display = 'block';
        return;
      }

      examData.name = name;
      examData.company = company;
      examData.idLast6 = verifiedIdLast6;
      examData.examType = examType;
      examData.answers = {};
      examData.currentIndex = 0;
      examData.startTime = Date.now();
      examData.remainingTime = examData.timeLimit;

      try {
        await loadQuestions(examType);
        startTimer();
        showPanel('exam-panel');
        document.getElementById('exam-title').textContent = `${examType}安全考试`;
        renderQuestion();
        renderQuestionNav();
      } catch (error) {
        console.error('加载试题失败:', error);
        document.getElementById('start-error').textContent = error.message || '加载试题失败，请稍后重试';
        document.getElementById('start-error').style.display = 'block';
      }
    }

    async function loadExamSubjects() {
      try {
        const response = await fetch('/api/exam_subjects');
        const result = await response.json();
        if (result.code === 200 && result.data) {
          const select = document.getElementById('exam-type');
          select.innerHTML = '<option value="">请选择考试科目</option>';
          examFileMap = {};
          result.data.forEach(sub => {
            examFileMap[sub.name] = sub.file;
            const opt = document.createElement('option');
            opt.value = sub.name;
            opt.textContent = sub.name;
            select.appendChild(opt);
          });
        } else {
          document.getElementById('exam-type').innerHTML = '<option value="">加载科目失败</option>';
        }
      } catch (error) {
        console.error('加载考试科目网络错误:', error);
        document.getElementById('exam-type').innerHTML = '<option value="">加载科目失败</option>';
      }
    }

    // 状态栏时钟
    function updateStatusBarTime() {
      const now = new Date();
      const h = now.getHours();
      const m = now.getMinutes().toString().padStart(2, '0');
      const el = document.getElementById('status-time');
      if (el) el.textContent = `${h}:${m}`;
    }

    document.addEventListener('DOMContentLoaded', function() {
      loadExamSubjects();
      updateStatusBarTime();
      setInterval(updateStatusBarTime, 30000);
    });

    async function loadQuestions(examType) {
      const fileName = examFileMap[examType];
      if (!fileName) {
        throw new Error('未找到对应试题文件');
      }
      const response = await fetch(`/api/get_questions?file=${encodeURIComponent(fileName)}`);
      const result = await response.json();
      if (result.code === 200) {
        const allQuestions = result.data;
        const shuffled = allQuestions.sort(() => Math.random() - 0.5);
        examData.questions = shuffled.slice(0, 25);
      } else {
        throw new Error(result.detail || result.message || '加载试题失败');
      }
    }

    // 渲染题目（大色块对/错按钮）
    function renderQuestion() {
      const container = document.getElementById('question-container');
      const question = examData.questions[examData.currentIndex];

      if (!question) {
        container.innerHTML = '<p style="color:var(--text-muted);text-align:center;">暂无题目</p>';
        return;
      }

      const selectedAnswer = examData.answers[examData.currentIndex];

      const correctClass = selectedAnswer === '对' ? 'selected-correct' : 'unselected';
      const wrongClass = selectedAnswer === '错' ? 'selected-wrong' : 'unselected';

      container.innerHTML = `
        <div class="question-card">
          <div class="question-header">
            <span class="question-number">${examData.currentIndex + 1}</span>
            <p class="question-text">${escapeHtml(question.question)}</p>
          </div>
          <div class="option-list">
            <div class="option-item ${correctClass}" onclick="selectAnswer('对')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
              <p class="option-label">对</p>
            </div>
            <div class="option-item ${wrongClass}" onclick="selectAnswer('错')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              <p class="option-label">错</p>
            </div>
          </div>
        </div>
      `;

      const counter = `${examData.currentIndex + 1}/${examData.questions.length}`;
      const pct = Math.round(((examData.currentIndex + 1) / examData.questions.length) * 100);
      document.getElementById('question-counter').textContent = counter;
      document.getElementById('progress-fill').style.width = pct + '%';
      document.getElementById('progress-pct').textContent = pct + '%';

      // 滚动导航条到当前题号
      const navInner = document.getElementById('question-nav');
      const currentNav = navInner.querySelector('.nav-item.current');
      if (currentNav) {
        currentNav.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      }
    }

    // 渲染题号导航（横向滑动）
    function renderQuestionNav() {
      const nav = document.getElementById('question-nav');
      nav.innerHTML = examData.questions.map((_, idx) => {
        const isCurrent = idx === examData.currentIndex;
        const isAnswered = examData.answers[idx] !== undefined;
        let cls = 'nav-item';
        if (isCurrent) cls += ' current';
        else if (isAnswered) cls += ' answered';
        return `<div class="${cls}" onclick="goToQuestion(${idx})">${idx + 1}</div>`;
      }).join('');
    }

    function selectAnswer(option) {
      examData.answers[examData.currentIndex] = option;
      renderQuestion();
      renderQuestionNav();
    }

    function prevQuestion() {
      if (examData.currentIndex > 0) {
        examData.currentIndex--;
        renderQuestion();
        renderQuestionNav();
      }
    }

    function nextQuestion() {
      if (examData.currentIndex < examData.questions.length - 1) {
        examData.currentIndex++;
        renderQuestion();
        renderQuestionNav();
      }
    }

    function goToQuestion(index) {
      examData.currentIndex = index;
      renderQuestion();
      renderQuestionNav();
    }

    function startTimer() {
      if (examData.timerInterval) {
        clearInterval(examData.timerInterval);
      }
      examData.timerInterval = setInterval(() => {
        examData.remainingTime--;
        const minutes = Math.floor(examData.remainingTime / 60);
        const seconds = examData.remainingTime % 60;
        document.getElementById('timer').textContent =
          `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        if (examData.remainingTime <= 0) {
          submitExam();
        }
      }, 1000);
    }

    async function submitExam() {
      const btnSubmit = document.getElementById('btn-submit');
      if (btnSubmit) {
        btnSubmit.disabled = true;
        btnSubmit.textContent = '正在交卷...';
      }
      if (examData.timerInterval) {
        clearInterval(examData.timerInterval);
      }

      const answersToSend = examData.questions.map((question, idx) => {
        return { question: question.question, user_answer: examData.answers[idx] || '' };
      });

      const elapsedSeconds = Math.floor((Date.now() - examData.startTime) / 1000);
      const elapsedMinutes = Math.floor(elapsedSeconds / 60);
      const elapsedSecs = elapsedSeconds % 60;
      const duration = `${elapsedMinutes}分${elapsedSecs}秒`;

      let score = 0;
      let correctCount = 0;
      let totalCount = examData.questions.length;

      try {
        const response = await fetch('/api/save_exam_record', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: examData.name,
            company: examData.company,
            id_last6: examData.idLast6,
            exam_type: examData.examType,
            duration: duration,
            answers: answersToSend
          })
        });
        const result = await response.json();
        if (result.code === 200 && result.data) {
          score = result.data.score;
          correctCount = result.data.correct_count;
          totalCount = result.data.total_count || totalCount;
        } else {
          alert('成绩保存失败: ' + (result.message || result.detail || '服务器判分异常'));
          if (btnSubmit) { btnSubmit.disabled = false; btnSubmit.textContent = '交卷'; }
          return;
        }
      } catch (error) {
        console.error('保存答题记录失败:', error);
        alert('提交考卷网络错误，请稍后重试');
        if (btnSubmit) { btnSubmit.disabled = false; btnSubmit.textContent = '交卷'; }
        return;
      }

      document.getElementById('result-score').innerHTML = `${score}<span class="score-unit">分</span>`;
      document.getElementById('detail-name').textContent = examData.name;
      document.getElementById('detail-company').textContent = examData.company;
      document.getElementById('detail-exam').textContent = examData.examType;
      document.getElementById('detail-answered').textContent = `${Object.keys(examData.answers).length}/${totalCount}`;
      document.getElementById('detail-correct').textContent = correctCount;
      document.getElementById('detail-time').textContent = duration;

      const isPass = score >= 90;
      const icon = document.getElementById('result-icon');
      const message = document.getElementById('result-message');

      if (isPass) {
        icon.className = 'result-icon-wrap result-icon-pass';
        icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>';
        message.textContent = '恭喜您，考试通过';
        message.style.color = 'var(--accent-color)';
      } else {
        icon.className = 'result-icon-wrap result-icon-fail';
        icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
        message.textContent = '很遗憾，考试未通过（及格线90分），请重试';
        message.style.color = 'var(--danger-color)';
      }

      const restartButton = document.getElementById('restart-exam-button');
      if (restartButton) restartButton.style.display = isPass ? 'none' : 'block';

      showPanel('result-panel');
    }

    async function restartExamDirectly() {
      if (!examData.name || !examData.company || !examData.examType) {
        restartExamWithNewSubject();
        return;
      }
      examData.answers = {};
      examData.currentIndex = 0;
      examData.startTime = Date.now();
      examData.remainingTime = examData.timeLimit;

      const btnSubmit = document.getElementById('btn-submit');
      if (btnSubmit) { btnSubmit.disabled = false; btnSubmit.textContent = '交卷'; }

      try {
        await loadQuestions(examData.examType);
        startTimer();
        showPanel('exam-panel');
        document.getElementById('exam-title').textContent = `${examData.examType}安全考试`;
        renderQuestion();
        renderQuestionNav();
      } catch (error) {
        console.error('加载试题失败:', error);
        alert(error.message || '加载试题失败，请稍后重试');
      }
    }

    async function restartExamWithNewSubject() {
      showPanel('start-panel');
      if (examData.name) {
        document.getElementById('exam-name').value = examData.name;
      }
      // 重置验证状态和界面
      verifiedCompany = '';
      verifiedIdLast6 = '';
      isApprovedUser = false;
      document.getElementById('exam-company-group').style.display = 'none';
      document.getElementById('exam-company-manual-group').style.display = 'none';
      document.getElementById('exam-type-group').style.display = 'none';
      document.getElementById('exam-info-box').style.display = 'none';
      document.getElementById('start-footer').style.display = 'none';
      document.getElementById('verify-footer').style.display = 'block';
      document.getElementById('exam-id-last6').value = '';
      document.getElementById('exam-type').value = '';
    }
  </script>
</body>
</html>
