<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>培训信息录入系统 - 在线答题</title>
  <link rel="stylesheet" href="/static/css/style.css?v=1.0.7">
  <style>
    #exam-company {
      cursor: pointer;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 12px center;
      background-size: 16px;
      padding-right: 36px;
    }
    #exam-company:focus {
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236366f1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    }
    /* 答题页面特定样式 */
    .exam-container {
      max-width: 800px;
      width: 100%;
    }
    .exam-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--glass-border);
      flex-wrap: wrap;
      gap: 15px;
    }
    .exam-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-main);
    }
    .exam-progress {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .progress-bar {
      width: 150px;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
      border-radius: 4px;
      transition: width 0.3s ease;
    }
    .question-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }
    .question-card:hover {
      border-color: rgba(99, 102, 241, 0.4);
    }
    .question-number {
      display: inline-flex;
      background: var(--primary-color);
      color: white;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      align-items: center;
      justify-content: center;
      font-size: 0.9rem;
      font-weight: 600;
      margin-right: 12px;
      flex-shrink: 0;
    }
    .question-text {
      font-size: 1.05rem;
      line-height: 1.6;
      color: var(--text-main);
      margin-bottom: 20px;
    }
    .option-list {
      display: flex;
      gap: 15px;
      justify-content: center;
    }
    .option-item {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px 40px;
      background: rgba(255, 255, 255, 0.03);
      border: 2px solid var(--glass-border);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 1.1rem;
      font-weight: 600;
      min-width: 100px;
    }
    .option-item:hover {
      border-color: var(--primary-color);
      background: rgba(79, 70, 229, 0.1);
    }
    .option-item.selected {
      border-color: var(--primary-color);
      background: rgba(79, 70, 229, 0.2);
      box-shadow: 0 0 15px rgba(79, 70, 229, 0.3);
    }
    .option-item.selected.correct {
      border-color: var(--accent-color);
      background: rgba(16, 185, 129, 0.2);
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
    }
    .option-item.selected.wrong {
      border-color: var(--danger-color);
      background: rgba(239, 68, 68, 0.2);
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.3);
    }
    .exam-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid var(--glass-border);
    }
    .btn-exam {
      width: auto;
      min-width: 100px;
    }
    .timer {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-muted);
    }
    .timer svg {
      width: 20px;
      height: 20px;
    }
    .question-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 20px;
      justify-content: center;
    }
    .nav-item {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.03);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .nav-item:hover {
      border-color: var(--primary-color);
    }
    .nav-item.current {
      background: var(--primary-color);
      color: white;
      border-color: var(--primary-color);
    }
    .nav-item.answered {
      background: var(--accent-color);
      color: white;
      border-color: var(--accent-color);
    }
    .result-container {
      text-align: center;
      padding: 40px 20px;
    }
    .result-icon {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 2.5rem;
    }
    .result-icon.pass {
      background: rgba(16, 185, 129, 0.2);
      color: var(--accent-color);
    }
    .result-icon.fail {
      background: rgba(239, 68, 68, 0.2);
      color: var(--danger-color);
    }
    .result-score {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 10px;
    }
    .result-message {
      font-size: 1.1rem;
      margin-bottom: 25px;
    }
    .result-details {
      text-align: left;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 25px;
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--glass-border);
    }
    .detail-row:last-child {
      border-bottom: none;
    }
    .hidden {
      display: none !important;
    }
    /* 答案正确/错误标记 */
    .answer-mark {
      display: inline-block;
      margin-left: 10px;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .answer-mark.correct {
      background: rgba(16, 185, 129, 0.2);
      color: var(--accent-color);
    }
    .answer-mark.wrong {
      background: rgba(239, 68, 68, 0.2);
      color: var(--danger-color);
    }
    @media (max-width: 600px) {
      .option-list {
        flex-direction: column;
      }
      .option-item {
        width: 100%;
      }
      .exam-header {
        flex-direction: column;
        align-items: flex-start;
      }
      .progress-bar {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <!-- 开始页面 -->
  <div class="glass-container exam-container" id="start-panel">
    <h2>在线考试系统</h2>
    <p class="subtitle">请填写个人信息并选择考试科目</p>
    
    <div class="alert alert-error" id="start-error"></div>
    
    <form id="start-form" onsubmit="startExam(event)">
      <div class="form-group">
        <label for="exam-name">姓名 *</label>
        <input type="text" id="exam-name" class="form-control" placeholder="请输入您的姓名" required>
      </div>
      
      <div class="form-group" style="position: relative;">
        <label for="exam-company">工作单位 *</label>
        <input type="text" id="exam-company" class="form-control" placeholder="输入或选择工作单位" autocomplete="off" required>
        <div id="exam-company-dropdown" style="display: none; position: absolute; top: calc(100% + 2px); left: 0; right: 0; background: rgba(15, 23, 42, 0.98); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; max-height: 220px; overflow-y: auto; z-index: 9999; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.6);"></div>
      </div>
      
      <div class="form-group" id="other-company-group" style="display: none; margin-top: 10px;">
        <label for="exam-company-other">请输入单位名称 *</label>
        <input type="text" id="exam-company-other" class="form-control" placeholder="请输入您的工作单位名称">
      </div>
      
      <div class="form-group">
        <label for="exam-type">考试科目 *</label>
        <select id="exam-type" class="form-control" required>
          <option value="">正在加载科目列表...</option>
        </select>
      </div>
      
      <button type="submit" class="btn btn-primary" style="margin-top: 20px;">开始答题</button>
    </form>
  </div>

  <!-- 答题页面 -->
  <div class="glass-container exam-container hidden" id="exam-panel">
    <div class="exam-header">
      <div class="exam-title" id="exam-title"></div>
      <div class="exam-progress">
        <span id="question-counter">1/25</span>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="timer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <span id="timer">30:00</span>
        </div>
      </div>
    </div>

    <div id="question-container"></div>

    <div class="question-nav" id="question-nav"></div>

    <div class="exam-actions">
      <button class="btn btn-secondary btn-exam" id="btn-prev" onclick="prevQuestion()">上一题</button>
      <button class="btn btn-warning btn-exam" id="btn-submit" onclick="submitExam()">交卷</button>
      <button class="btn btn-primary btn-exam" id="btn-next" onclick="nextQuestion()">下一题</button>
    </div>
  </div>

  <!-- 结果页面 -->
  <div class="glass-container exam-container hidden" id="result-panel">
    <div class="result-container">
      <div class="result-icon" id="result-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <div class="result-score" id="result-score">0</div>
      <div class="result-message" id="result-message"></div>
      
      <div class="result-details">
        <div class="detail-row">
          <span>姓名：</span>
          <strong id="detail-name"></strong>
        </div>
        <div class="detail-row">
          <span>工作单位：</span>
          <strong id="detail-company"></strong>
        </div>
        <div class="detail-row">
          <span>考试科目：</span>
          <strong id="detail-exam"></strong>
        </div>
        <div class="detail-row">
          <span>答题数：</span>
          <strong id="detail-answered"></strong>
        </div>
        <div class="detail-row">
          <span>正确数：</span>
          <strong id="detail-correct"></strong>
        </div>
        <div class="detail-row">
          <span>用时：</span>
          <strong id="detail-time"></strong>
        </div>
      </div>

      <button class="btn btn-primary" onclick="restartExamDirectly()">重新答题</button>
      <button class="btn btn-secondary" onclick="restartExamWithNewSubject()" style="margin-top: 10px; background: rgba(255, 255, 255, 0.08); border: 1px solid var(--glass-border); color: var(--text-main); width: 100%;">更换科目 / 返回登录</button>
    </div>
  </div>

  <script>
    // 考试状态
    let examData = {
      name: '',
      company: '',
      examType: '',
      questions: [],
      answers: {},
      currentIndex: 0,
      startTime: 0,
      timeLimit: 30 * 60, // 30分钟
      remainingTime: 0,
      timerInterval: null
    };

    // 试题文件映射 (改为动态加载)
    let examFileMap = {};

    // 显示/隐藏面板
    function showPanel(panelId) {
      document.querySelectorAll('.glass-container').forEach(panel => {
        panel.classList.add('hidden');
      });
      document.getElementById(panelId).classList.remove('hidden');
    }

    // 开始考试
    async function startExam(e) {
      e.preventDefault();
      
      const name = document.getElementById('exam-name').value;
      const examCompanyInput = document.getElementById('exam-company').value.trim();
      const examType = document.getElementById('exam-type').value;
      
      let company = examCompanyInput;
      if (examCompanyInput === '其他单位') {
        company = document.getElementById('exam-company-other').value.trim();
      }
      
      if (!name || !company || !examType) {
        document.getElementById('start-error').textContent = '请填写完整信息';
        document.getElementById('start-error').style.display = 'block';
        return;
      }
      
      document.getElementById('start-error').style.display = 'none';
      
      examData.name = name;
      examData.company = company;
      examData.examType = examType;
      examData.answers = {};
      examData.currentIndex = 0;
      examData.startTime = Date.now();
      examData.remainingTime = examData.timeLimit;
      
      try {
        // 加载试题
        await loadQuestions(examType);
        
        // 初始化计时器
        startTimer();
        
        // 显示答题页面
        showPanel('exam-panel');
        document.getElementById('exam-title').textContent = `${examType}安全知识考试`;
        renderQuestion();
        renderQuestionNav();
      } catch (error) {
        console.error('加载试题失败:', error);
        alert('加载试题失败，请稍后重试');
      }
    }

    // 自动回填公司
    function fillCompanyValue(companyValue) {
      if (!companyValue) return;
      const input = document.getElementById('exam-company');
      const otherGroup = document.getElementById('other-company-group');
      const otherInput = document.getElementById('exam-company-other');
      
      if (companyValue === '其他单位') {
        input.value = '其他单位';
        otherGroup.style.display = 'block';
        otherInput.required = true;
      } else {
        input.value = companyValue;
        otherGroup.style.display = 'none';
        otherInput.required = false;
        otherInput.value = '';
      }
    }

    let examCompanyList = []; // 缓存单位列表
    
    // 加载工作单位选项
    async function loadCompanies() {
      try {
        const response = await fetch('/api/companies');
        const result = await response.json();
        if (result.code === 200 && result.data && result.data.length > 0) {
          examCompanyList = result.data;
          console.log('工作单位加载成功，共', examCompanyList.length, '个单位');
        } else {
          examCompanyList = [];
          console.log('工作单位数据为空');
        }
        
        // 如果已经有缓存的 company，进行回填
        if (examData.company) {
          fillCompanyValue(examData.company);
        }
      } catch (error) {
        console.error('加载工作单位失败:', error);
        examCompanyList = [];
      }
    }
    
    // 显示下拉菜单
    function showExamCompanyDropdown() {
      var dropdown = document.getElementById('exam-company-dropdown');
      if (dropdown) {
        dropdown.style.display = 'block';
        renderExamCompanyDropdown('');
      }
    }
    
    // 隐藏下拉菜单（延迟200ms，防止点击选项时先触发blur）
    function hideExamCompanyDropdown() {
      setTimeout(function() {
        var dropdown = document.getElementById('exam-company-dropdown');
        if (dropdown) {
          dropdown.style.display = 'none';
        }
      }, 200);
    }
    
    // 输入时过滤
    function handleExamCompanyInput() {
      var val = document.getElementById('exam-company').value.trim();
      renderExamCompanyDropdown(val);
      // 检查是否选中了"其他单位"
      var otherGroup = document.getElementById('other-company-group');
      var otherInput = document.getElementById('exam-company-other');
      if (val === '其他单位') {
        otherGroup.style.display = 'block';
        otherInput.required = true;
      } else {
        otherGroup.style.display = 'none';
        otherInput.required = false;
        otherInput.value = '';
      }
    }
    
    // 渲染下拉菜单（支持搜索过滤）
    function renderExamCompanyDropdown(filterText) {
      var dropdown = document.getElementById('exam-company-dropdown');
      if (!dropdown) return;
      dropdown.innerHTML = '';
      
      // 过滤列表
      var filtered = examCompanyList;
      if (filterText) {
        var lowerText = filterText.toLowerCase();
        filtered = examCompanyList.filter(function(c) {
          return c.toLowerCase().indexOf(lowerText) !== -1;
        });
      }
      
      // 渲染匹配的单位
      filtered.forEach(function(c) {
        var item = document.createElement('div');
        item.style.cssText = 'padding: 10px 14px; color: #fff; font-size: 0.95rem; cursor: pointer; transition: background 0.2s; border-bottom: 1px solid rgba(255,255,255,0.05);';
        item.textContent = c;
        item.onmouseover = function() { item.style.background = 'rgba(99, 102, 241, 0.2)'; };
        item.onmouseout = function() { item.style.background = 'transparent'; };
        item.onmousedown = function(e) {
          e.preventDefault();
          document.getElementById('exam-company').value = c;
          dropdown.style.display = 'none';
          // 隐藏其他单位输入框
          document.getElementById('other-company-group').style.display = 'none';
          document.getElementById('exam-company-other').required = false;
          document.getElementById('exam-company-other').value = '';
        };
        dropdown.appendChild(item);
      });
      
      // 如果过滤结果为空，显示提示
      if (filtered.length === 0) {
        var noMatch = document.createElement('div');
        noMatch.style.cssText = 'padding: 8px 14px; color: var(--text-muted, #94a3b8); font-size: 0.85rem;';
        noMatch.textContent = '无匹配单位';
        dropdown.appendChild(noMatch);
      }
      
      // 始终在末尾追加"其他单位"选项
      var otherItem = document.createElement('div');
      otherItem.style.cssText = 'padding: 10px 14px; color: var(--accent-color, #10b981); font-size: 0.95rem; cursor: pointer; transition: background 0.2s; border-top: 1px solid rgba(255,255,255,0.1); font-weight: 600;';
      otherItem.textContent = '其他单位（手动输入）';
      otherItem.onmouseover = function() { otherItem.style.background = 'rgba(16, 185, 129, 0.15)'; };
      otherItem.onmouseout = function() { otherItem.style.background = 'transparent'; };
      otherItem.onmousedown = function(e) {
        e.preventDefault();
        document.getElementById('exam-company').value = '其他单位';
        dropdown.style.display = 'none';
        document.getElementById('other-company-group').style.display = 'block';
        document.getElementById('exam-company-other').required = true;
        document.getElementById('exam-company-other').focus();
      };
      dropdown.appendChild(otherItem);
    }

    async function loadExamSubjects() {
      try {
        const response = await fetch('/api/exam_subjects');
        const result = await response.json();
        if (result.code === 200 && result.data) {
          const select = document.getElementById('exam-type');
          select.innerHTML = '<option value="">请选择考试科目</option>';
          
          examFileMap = {};
          result.data.forEach(sub => {
            examFileMap[sub.name] = sub.file;
            const opt = document.createElement('option');
            opt.value = sub.name;
            opt.textContent = sub.name;
            select.appendChild(opt);
          });
          console.log('成功动态加载考试科目:', Object.keys(examFileMap).length, '个');
        } else {
          document.getElementById('exam-type').innerHTML = '<option value="">加载科目失败</option>';
        }
      } catch (error) {
        console.error('加载考试科目网络错误:', error);
        document.getElementById('exam-type').innerHTML = '<option value="">加载科目失败</option>';
      }
    }

    // 页面加载完成后初始化
    document.addEventListener('DOMContentLoaded', function() {
      loadCompanies();
      loadExamSubjects(); // 动态加载科目选项列表
      
      // 绑定工作单位输入框事件
      var companyInput = document.getElementById('exam-company');
      companyInput.addEventListener('focus', showExamCompanyDropdown);
      companyInput.addEventListener('click', showExamCompanyDropdown);
      companyInput.addEventListener('input', handleExamCompanyInput);
      companyInput.addEventListener('blur', hideExamCompanyDropdown);
    });

    // 加载试题
    async function loadQuestions(examType) {
      const fileName = examFileMap[examType];
      if (!fileName) {
        throw new Error('未找到对应试题文件');
      }
      
      const response = await fetch(`/api/get_questions?file=${encodeURIComponent(fileName)}`);
      const result = await response.json();
      
      if (result.code === 200) {
        // 随机抽取25道题
        const allQuestions = result.data;
        const shuffled = allQuestions.sort(() => Math.random() - 0.5);
        examData.questions = shuffled.slice(0, 25);
      } else {
        throw new Error(result.message || '加载试题失败');
      }
    }

    // 渲染题目
    function renderQuestion() {
      const container = document.getElementById('question-container');
      const question = examData.questions[examData.currentIndex];
      
      if (!question) {
        container.innerHTML = '<p class="no-data">暂无题目</p>';
        return;
      }
      
      const selectedAnswer = examData.answers[examData.currentIndex];
      
      container.innerHTML = `
        <div class="question-card">
          <div style="display: flex; align-items: flex-start;">
            <span class="question-number">${examData.currentIndex + 1}</span>
            <div class="question-text">${question.question}</div>
          </div>
          <div class="option-list">
            <div class="option-item ${selectedAnswer === '对' ? 'selected' : ''}" onclick="selectAnswer('对')">
              ✓ 对
            </div>
            <div class="option-item ${selectedAnswer === '错' ? 'selected' : ''}" onclick="selectAnswer('错')">
              ✗ 错
            </div>
          </div>
        </div>
      `;
      
      // 更新计数器和进度
      document.getElementById('question-counter').textContent = 
        `${examData.currentIndex + 1}/${examData.questions.length}`;
      document.getElementById('progress-fill').style.width = 
        `${((examData.currentIndex + 1) / examData.questions.length) * 100}%`;
    }

    // 渲染题目导航
    function renderQuestionNav() {
      const nav = document.getElementById('question-nav');
      nav.innerHTML = examData.questions.map((_, idx) => {
        const isCurrent = idx === examData.currentIndex;
        const isAnswered = examData.answers[idx] !== undefined;
        return `
          <div class="nav-item ${isCurrent ? 'current' : ''} ${isAnswered && !isCurrent ? 'answered' : ''}" 
               onclick="goToQuestion(${idx})">
            ${idx + 1}
          </div>
        `;
      }).join('');
    }

    // 选择答案
    function selectAnswer(option) {
      examData.answers[examData.currentIndex] = option;
      renderQuestion();
      renderQuestionNav();
    }

    // 上一题
    function prevQuestion() {
      if (examData.currentIndex > 0) {
        examData.currentIndex--;
        renderQuestion();
        renderQuestionNav();
      }
    }

    // 下一题
    function nextQuestion() {
      if (examData.currentIndex < examData.questions.length - 1) {
        examData.currentIndex++;
        renderQuestion();
        renderQuestionNav();
      }
    }

    // 跳转到指定题目
    function goToQuestion(index) {
      examData.currentIndex = index;
      renderQuestion();
      renderQuestionNav();
    }

    // 开始计时器
    function startTimer() {
      if (examData.timerInterval) {
        clearInterval(examData.timerInterval);
      }
      
      examData.timerInterval = setInterval(() => {
        examData.remainingTime--;
        
        const minutes = Math.floor(examData.remainingTime / 60);
        const seconds = examData.remainingTime % 60;
        document.getElementById('timer').textContent = 
          `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        
        if (examData.remainingTime <= 0) {
          submitExam();
        }
      }, 1000);
    }

    // 提交考试
    async function submitExam() {
      const btnSubmit = document.getElementById('btn-submit');
      if (btnSubmit) {
        btnSubmit.disabled = true;
        btnSubmit.textContent = '正在交卷...';
      }

      if (examData.timerInterval) {
        clearInterval(examData.timerInterval);
      }
      
      // 提取用户的答卷列表发送给后端
      const answersToSend = examData.questions.map((question, idx) => {
        return {
          question: question.question,
          user_answer: examData.answers[idx] || ''
        };
      });
      
      // 计算用时
      const elapsedSeconds = Math.floor((Date.now() - examData.startTime) / 1000);
      const elapsedMinutes = Math.floor(elapsedSeconds / 60);
      const elapsedSecs = elapsedSeconds % 60;
      const duration = `${elapsedMinutes}分${elapsedSecs}秒`;
      
      let score = 0;
      let correctCount = 0;
      let totalCount = examData.questions.length;
      
      // 保存答题记录到服务器，由后端统一判分以防作弊
      try {
        const response = await fetch('/api/save_exam_record', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            name: examData.name,
            company: examData.company,
            exam_type: examData.examType,
            duration: duration,
            answers: answersToSend
          })
        });
        const result = await response.json();
        console.log('答题记录保存结果:', result);
        if (result.code === 200 && result.data) {
          score = result.data.score;
          correctCount = result.data.correct_count;
          totalCount = result.data.total_count || totalCount;
        } else {
          alert('成绩保存失败: ' + (result.message || result.detail || '服务器判分异常'));
          if (btnSubmit) {
            btnSubmit.disabled = false;
            btnSubmit.textContent = '交卷';
          }
        }
      } catch (error) {
        console.error('保存答题记录失败:', error);
        alert('提交考卷网络错误，请稍后重试');
        if (btnSubmit) {
          btnSubmit.disabled = false;
          btnSubmit.textContent = '交卷';
        }
      }
      
      // 更新结果页面
      document.getElementById('result-score').textContent = `${score}分`;
      document.getElementById('detail-name').textContent = examData.name;
      document.getElementById('detail-company').textContent = examData.company;
      document.getElementById('detail-exam').textContent = examData.examType;
      document.getElementById('detail-answered').textContent = 
        `${Object.keys(examData.answers).length}/${totalCount}`;
      document.getElementById('detail-correct').textContent = correctCount;
      document.getElementById('detail-time').textContent = duration;
      
      // 设置结果状态
      const isPass = score >= 90;
      const icon = document.getElementById('result-icon');
      const message = document.getElementById('result-message');
      
      if (isPass) {
        icon.className = 'result-icon pass';
        icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg>';
        message.textContent = '恭喜您！考试通过！';
        message.style.color = 'var(--accent-color)';
      } else {
        icon.className = 'result-icon fail';
        icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>';
        message.textContent = '很遗憾，考试未通过（及格线90分），请重试';
        message.style.color = 'var(--danger-color)';
      }
      
      showPanel('result-panel');
    }

    // 直接以相同的姓名、单位、科目重新答题
    async function restartExamDirectly() {
      if (!examData.name || !examData.company || !examData.examType) {
        restartExamWithNewSubject();
        return;
      }
      
      examData.answers = {};
      examData.currentIndex = 0;
      examData.startTime = Date.now();
      examData.remainingTime = examData.timeLimit;
      
      try {
        await loadQuestions(examData.examType);
        startTimer();
        showPanel('exam-panel');
        document.getElementById('exam-title').textContent = `${examData.examType}安全知识考试`;
        renderQuestion();
        renderQuestionNav();
      } catch (error) {
        console.error('加载试题失败:', error);
        alert('加载试题失败，请稍后重试');
      }
    }

    // 返回科目选择，但自动保留和回填已填写的姓名 and 工作单位
    async function restartExamWithNewSubject() {
      showPanel('start-panel');
      if (examData.name) {
        document.getElementById('exam-name').value = examData.name;
      }
      await loadCompanies();
      document.getElementById('exam-type').value = '';
    }
  </script>
</body>
</html>
