server {
    listen 443 ssl;
    server_name 8.148.25.74;

    # Certificate material is provisioned on the server, never in this repository.
    ssl_certificate     /etc/nginx/tls/peixun-ip.crt;
    ssl_certificate_key /etc/nginx/tls/peixun-ip.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 10m;

    # ID-card photos may be uploaded through the mobile client.
    client_max_body_size 20m;

    location / {
        proxy_pass http://peixun-app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
