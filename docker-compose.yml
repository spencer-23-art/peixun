version: '3.8'

services:
  peixun-app:
    build: .
    container_name: peixun-service
    ports:
      - "8001:8000" # 避开原项目占用的 8000 端口，映射到服务器的 8001 端口
    volumes:
      - ./uploads:/app/uploads # 挂载图片目录，容器升级重建不丢失照片
      # 注意：如果需要将 SQLite 数据库文件也挂载出来：
      # 请先在宿主机根目录下执行 `touch peixun.db` 创建空文件，然后取消下行注释，否则 Docker 会误将其当成文件夹挂载导致报错。
      # - ./peixun.db:/app/peixun.db
    restart: always
