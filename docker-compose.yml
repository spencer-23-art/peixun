version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: peixun-redis
    restart: always

  peixun-worker:
    build: .
    container_name: peixun-worker
    command: celery -A app.celery_app worker --loglevel=info --pool=solo
    environment:
      REDIS_URL: "redis://redis:6379/0"
    volumes:
      - /data/peixun/uploads:/app/uploads
      - ./app:/app/app
    depends_on:
      - redis
    restart: always

  peixun-app:
    build: .
    container_name: peixun-service
    ports:
      - "8000:8000" # 映射到服务器的 8000 端口
    environment:
      # 固定的 HMAC 签名密钥：保证容器重启后已签发的登录 token 仍然有效，
      # 不会出现"重启即全员掉线"。切勿随意更改，更改后所有旧 token 立即失效。
      PEIXUN_SECRET_KEY: "f3a9c1e7b4d24e8a9c5f1b6e0d3a7c2e8b9f4a1c6d5e0b7a3f2c8e9d1b4a6c5"
      REDIS_URL: "redis://redis:6379/0"
    volumes:
      - /data/peixun/uploads:/app/uploads # 挂载图片目录，与代码解耦
      - ./static:/app/static   # 挂载静态网页目录，后续 git pull 静态 HTML 可热生效，无需重新构建容器
      - ./main.py:/app/main.py # 挂载主后端代码
      - ./ocr_handler.py:/app/ocr_handler.py # 挂载OCR模块
      - ./start_server.py:/app/start_server.py # 挂载启动脚本
      - ./app:/app/app         # 挂载 app 模块目录
      # 挂载 SQLite 数据库文件，防止容器重建时数据丢失，与代码解耦
      - /data/peixun/peixun.db:/app/peixun.db
      # 挂载题库目录，防止容器升级或重建时动态上传的题库丢失，与代码解耦
      - /data/peixun/shiti:/app/shiti
    depends_on:
      - redis
      - peixun-worker
    restart: always
